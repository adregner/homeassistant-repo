# Install manifest for the add-on repository.
# Place at: <homeassistant-repo>/ahome-enforcer/config.yaml
#
# Because `image:` is set, the Supervisor PULLS the pre-built image (published
# to GHCR by ahome-enforcer's release-addon workflow) instead of building on the
# device. No Dockerfile / build.yaml / rootfs belong in this folder.
#
# Keep `version` in sync with the published image tag and with
# ahome-enforcer/build/ha-addon/config.yaml.
name: AHome Enforcer
version: "0.1.0"
slug: ahome_enforcer
description: Declarative, state-based rule enforcement for Home Assistant
url: https://github.com/adregner/ahome-enforcer
image: ghcr.io/adregner/{arch}-ahome-enforcer
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
options:
  source: websocket
  log:
    level: info
schema:
  source: list(websocket|mqtt)
  log:
    level: list(debug|info|warn|error)?
  mqtt:
    broker: str?
    username: str?
    password: password?
    topic_prefix: str?
  intervals:
    full_state_fetch: str?
    full_recompute: str?
  http:
    ingress_only: bool?
