# Install manifest for the add-on repository.
# Place at: <homeassistant-repo>/ahome-enforcer/config.yaml
#
# Because `image:` is set, the Supervisor PULLS the pre-built image (published
# to GHCR by ahome-enforcer's release-addon workflow) instead of building on the
# device. No Dockerfile / build.yaml / rootfs belong in this folder.
#
# Keep `version` in sync with the published image tag and with
# ahome-enforcer/build/ha-addon/config.yaml.
name: AHome Enforcer
version: "0.2.0"
slug: ahome_enforcer
description: Declarative, state-based rule enforcement for Home Assistant
url: https://github.com/adregner/ahome-enforcer
image: ghcr.io/adregner/{arch}-ahome-enforcer
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
# Bind-mount this add-on's own config folder at /config so rule files live
# somewhere users can actually reach: it surfaces on the host under
# /addon_configs/<slug>, which the Samba, File Editor and Studio Code Server
# add-ons all expose. The folder belongs to this add-on alone, so mapping it
# writable grants nothing over the rest of the Home Assistant configuration.
# The mount path is explicit: Supervisor mounts a folder at /<type-name>
# (here /addon_config) unless `path:` says otherwise.
map:
  - type: addon_config
    read_only: false
    path: /config
# Every group declared under `schema` must also appear under `options`, even
# when all its fields are optional — the Supervisor requires the parent dict to
# be present (home-assistant/supervisor#2559, #4606). So seed them all here.
options:
  source: websocket
  paths:
    rules_dir: /config/rules
  log:
    level: info
  mqtt:
    topic_prefix: homeassistant
  intervals:
    full_state_fetch: 5m
    full_recompute: 1m
  http:
    ingress_only: true
schema:
  source: list(websocket|mqtt)
  paths:
    rules_dir: str?
  log:
    level: list(debug|info|warn|error)?
  mqtt:
    broker: str?
    username: str?
    password: password?
    topic_prefix: str?
  intervals:
    full_state_fetch: str?
    full_recompute: str?
  http:
    ingress_only: bool?
